<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Rose de combat du profil Nazz-Eq-20%-Rc2</title>
  <desc id="desc">Silhouette polaire de douze confrontations monotypes orientées. Les pointes rouges indiquent un avantage à l'attaquant et les creux bleus un avantage au défenseur. Données de la campagne X-simplex à 12 000 Or, 4 000 combats par orientation.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#263557" stop-opacity=".42"/>
      <stop offset=".72" stop-color="#151d35" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".48" stop-color="#8290aa"/>
      <stop offset=".52" stop-color="#8290aa"/>
      <stop offset="1" stop-color="#f05252"/>
    </linearGradient>
    <filter id="glow-red" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7ff;letter-spacing:.01em}
      .subtitle{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa8c3}
      .axis{stroke:#34415e;stroke-width:1}
      .axis-opposite{stroke:#52617f;stroke-width:1.4}
      .ring{fill:none;stroke:#2d3954;stroke-width:1}
      .balance{fill:none;stroke:#93a1bc;stroke-width:2;stroke-dasharray:3 7}
      .shape{fill:#b7c2e4;fill-opacity:.08;stroke:#dbe3ff;stroke-opacity:.6;stroke-width:2;stroke-linejoin:round}
      .attack{stroke:#f05252;fill:#f05252}
      .defense{stroke:#4f8cff;fill:#4f8cff}
      .neutral{stroke:#aab5cc;fill:#aab5cc}
      .ray{stroke-width:9;stroke-linecap:round}
      .point{stroke:#0b1020;stroke-width:3}
      .label{font:650 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eef2ff}
      .value{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace}
      .small{font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa8c3}
      .panel-title{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7ff}
      .panel-text{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#bbc5da}
      .mono{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e7ecfa}
      .mirror-label{font:700 10px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eaf0ff;text-anchor:middle}
      .mirror-value{font:700 9px ui-monospace,SFMono-Regular,Consolas,monospace;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="820" rx="24" fill="#0b1020"/>
  <circle cx="430" cy="430" r="345" fill="url(#halo)"/>

  <text x="50" y="52" class="title">Rose de combat</text>
  <text x="50" y="78" class="subtitle">Nazz-Eq-20%-Rc2 · monotypes à 12 000 Or · météo neutre · 4 000 combats par orientation</text>

  <!-- Reference rings: defender dominance, equilibrium, attacker dominance. -->
  <circle cx="430" cy="430" r="85" class="ring"/>
  <circle cx="430" cy="430" r="180" class="balance"/>
  <circle cx="430" cy="430" r="275" class="ring"/>
  <text x="443" y="245" class="small">équilibre</text>

  <!-- Twelve directed matchups. Reverse directions are diametrically opposed. -->
  <g opacity=".9">
    <line x1="430" y1="345" x2="430" y2="155" class="axis axis-opposite"/>
    <line x1="472.5" y1="356.4" x2="567.5" y2="191.8" class="axis"/>
    <line x1="503.6" y1="387.5" x2="668.2" y2="292.5" class="axis"/>
    <line x1="515" y1="430" x2="705" y2="430" class="axis axis-opposite"/>
    <line x1="503.6" y1="472.5" x2="668.2" y2="567.5" class="axis"/>
    <line x1="472.5" y1="503.6" x2="567.5" y2="668.2" class="axis"/>
    <line x1="430" y1="515" x2="430" y2="705" class="axis axis-opposite"/>
    <line x1="387.5" y1="503.6" x2="292.5" y2="668.2" class="axis"/>
    <line x1="356.4" y1="472.5" x2="191.8" y2="567.5" class="axis"/>
    <line x1="345" y1="430" x2="155" y2="430" class="axis axis-opposite"/>
    <line x1="356.4" y1="387.5" x2="191.8" y2="292.5" class="axis"/>
    <line x1="387.5" y1="356.4" x2="292.5" y2="191.8" class="axis"/>
  </g>

  <!-- Connected contour: one memorable silhouette for the ruleset. -->
  <polygon class="shape" points="430,345 496.7,314.4 617.5,321.8 541.2,430 638.2,550.2 520.5,586.7 430,515.7 292.5,668.2 305.7,501.8 345,430 356.4,387.5 300,204.8"/>

  <!-- Advantage segments, from the equilibrium ring to the measured point. -->
  <g>
    <g><title>Soldat attaque Lancier : 0 % / 0 % nuls / 100 % défenseur</title><line x1="430" y1="250" x2="430" y2="345" class="defense ray" filter="url(#glow-blue)"/><circle cx="430" cy="345" r="7" class="defense point"/></g>
    <g><title>Soldat attaque Archer : 25,5 % / 0 % nuls / 74,5 % défenseur</title><line x1="520" y1="274.1" x2="496.7" y2="314.4" class="defense ray"/><circle cx="496.7" cy="314.4" r="7" class="defense point"/></g>
    <g><title>Soldat attaque Chevalier : 69,2 % / 0 % nuls / 30,8 % défenseur</title><line x1="585.9" y1="340" x2="617.5" y2="321.8" class="attack ray"/><circle cx="617.5" cy="321.8" r="7" class="attack point"/></g>
    <g><title>Lancier attaque Archer : 13,8 % / 0 % nuls / 86,2 % défenseur</title><line x1="610" y1="430" x2="541.2" y2="430" class="defense ray"/><circle cx="541.2" cy="430" r="7" class="defense point"/></g>
    <g><title>Lancier attaque Chevalier : 81,8 % / 0 % nuls / 18,2 % défenseur</title><line x1="585.9" y1="520" x2="638.2" y2="550.2" class="attack ray"/><circle cx="638.2" cy="550.2" r="7" class="attack point"/></g>
    <g><title>Archer attaque Chevalier : 50,5 % / 0 % nuls / 49,5 % défenseur</title><line x1="520" y1="585.9" x2="520.5" y2="586.7" class="neutral ray"/><circle cx="520.5" cy="586.7" r="7" class="neutral point"/></g>
    <g><title>Lancier attaque Soldat : 0,4 % / 0 % nuls / 99,7 % défenseur</title><line x1="430" y1="610" x2="430" y2="515.7" class="defense ray" filter="url(#glow-blue)"/><circle cx="430" cy="515.7" r="7" class="defense point"/></g>
    <g><title>Archer attaque Soldat : 100 % / 0 % nuls / 0 % défenseur</title><line x1="340" y1="585.9" x2="292.5" y2="668.2" class="attack ray" filter="url(#glow-red)"/><circle cx="292.5" cy="668.2" r="7" class="attack point"/></g>
    <g><title>Chevalier attaque Soldat : 30,8 % / 0 % nuls / 69,2 % défenseur</title><line x1="274.1" y1="520" x2="305.7" y2="501.8" class="defense ray"/><circle cx="305.7" cy="501.8" r="7" class="defense point"/></g>
    <g><title>Archer attaque Lancier : 0 % / 0 % nuls / 100 % défenseur</title><line x1="250" y1="430" x2="345" y2="430" class="defense ray" filter="url(#glow-blue)"/><circle cx="345" cy="430" r="7" class="defense point"/></g>
    <g><title>Chevalier attaque Lancier : 0 % / 0 % nuls / 100 % défenseur</title><line x1="274.1" y1="340" x2="356.4" y2="387.5" class="defense ray" filter="url(#glow-blue)"/><circle cx="356.4" cy="387.5" r="7" class="defense point"/></g>
    <g><title>Chevalier attaque Archer : 92,2 % / 0 % nuls / 7,9 % défenseur</title><line x1="340" y1="274.1" x2="300" y2="204.8" class="attack ray" filter="url(#glow-red)"/><circle cx="300" cy="204.8" r="7" class="attack point"/></g>
  </g>

  <!-- Outer labels. -->
  <g text-anchor="middle">
    <text x="430" y="142" class="label">Soldat → Lancier</text><text x="430" y="160" class="value defense">−100</text>
    <text x="565" y="190" class="label">Soldat → Archer</text><text x="565" y="208" class="value defense">−49</text>
    <text x="670" y="289" class="label">Soldat → Chevalier</text><text x="670" y="307" class="value attack">+38</text>
    <text x="750" y="426" class="label" text-anchor="end">Lancier → Archer</text><text x="750" y="444" class="value defense" text-anchor="end">−72</text>
    <text x="670" y="570" class="label">Lancier → Chevalier</text><text x="670" y="588" class="value attack">+64</text>
    <text x="570" y="674" class="label">Archer → Chevalier</text><text x="570" y="692" class="value neutral">+1</text>
    <text x="430" y="724" class="label">Lancier → Soldat</text><text x="430" y="742" class="value defense">−99</text>
    <text x="292" y="674" class="label">Archer → Soldat</text><text x="292" y="692" class="value attack">+100</text>
    <text x="190" y="570" class="label">Chevalier → Soldat</text><text x="190" y="588" class="value defense">−38</text>
    <text x="142" y="426" class="label" text-anchor="end">Archer → Lancier</text><text x="142" y="444" class="value defense" text-anchor="end">−100</text>
    <text x="190" y="289" class="label">Chevalier → Lancier</text><text x="190" y="307" class="value defense">−100</text>
    <text x="292" y="190" class="label">Chevalier → Archer</text><text x="292" y="208" class="value attack">+84</text>
  </g>

  <!-- Mirror witnesses in the center. -->
  <circle cx="430" cy="430" r="68" fill="#11182b" stroke="#3b4865" stroke-width="1.5"/>
  <text x="430" y="414" class="small" text-anchor="middle">MIROIRS</text>
  <g><title>Soldat contre Soldat : avantage attaquant −2 points</title><circle cx="430" cy="380" r="22" fill="#18233d" stroke="#4f8cff"/><text x="430" y="378" class="mirror-label">S</text><text x="430" y="392" class="mirror-value defense">−2</text></g>
  <g><title>Lancier contre Lancier : avantage attaquant −100 points</title><circle cx="480" cy="430" r="22" fill="#18233d" stroke="#4f8cff"/><text x="480" y="428" class="mirror-label">L</text><text x="480" y="442" class="mirror-value defense">−100</text></g>
  <g><title>Archer contre Archer : avantage attaquant +100 points</title><circle cx="430" cy="480" r="22" fill="#301b29" stroke="#f05252"/><text x="430" y="478" class="mirror-label">A</text><text x="430" y="492" class="mirror-value attack">+100</text></g>
  <g><title>Chevalier contre Chevalier : avantage attaquant −15 points</title><circle cx="380" cy="430" r="22" fill="#18233d" stroke="#4f8cff"/><text x="380" y="428" class="mirror-label">C</text><text x="380" y="442" class="mirror-value defense">−15</text></g>

  <!-- Reading panel. -->
  <g transform="translate(785 128)">
    <rect width="365" height="570" rx="18" fill="#11182b" stroke="#2b3854"/>
    <text x="28" y="42" class="panel-title">Comment lire cette empreinte</text>
    <text x="28" y="75" class="panel-text">Chaque rayon est une confrontation orientée.</text>
    <text x="28" y="98" class="panel-text">Les directions inverses se font face.</text>

    <rect x="28" y="128" width="309" height="12" rx="6" fill="url(#scale)"/>
    <line x1="182.5" y1="121" x2="182.5" y2="148" stroke="#e7ecfa" stroke-width="2"/>
    <text x="28" y="164" class="small">défenseur −100</text>
    <text x="182.5" y="164" class="small" text-anchor="middle">équilibre</text>
    <text x="337" y="164" class="small" text-anchor="end">+100 attaquant</text>

    <text x="28" y="210" class="panel-title">Lecture immédiate</text>
    <circle cx="36" cy="240" r="5" fill="#f05252"/>
    <text x="52" y="245" class="panel-text">Archer → Soldat</text>
    <text x="337" y="245" class="mono attack" text-anchor="end">+100</text>
    <circle cx="36" cy="273" r="5" fill="#f05252"/>
    <text x="52" y="278" class="panel-text">Chevalier → Archer</text>
    <text x="337" y="278" class="mono attack" text-anchor="end">+84</text>
    <circle cx="36" cy="306" r="5" fill="#4f8cff"/>
    <text x="52" y="311" class="panel-text">Soldat → Lancier</text>
    <text x="337" y="311" class="mono defense" text-anchor="end">−100</text>
    <circle cx="36" cy="339" r="5" fill="#4f8cff"/>
    <text x="52" y="344" class="panel-text">Chevalier → Lancier</text>
    <text x="337" y="344" class="mono defense" text-anchor="end">−100</text>

    <line x1="28" y1="376" x2="337" y2="376" stroke="#2b3854"/>
    <text x="28" y="410" class="panel-title">Valeur portée par le rayon</text>
    <text x="28" y="441" class="mono">victoires attaque − victoires défense</text>
    <text x="28" y="470" class="panel-text">Les matchs nuls réduisent l'amplitude ;</text>
    <text x="28" y="491" class="panel-text">ils ne sont attribués à aucun camp.</text>

    <line x1="28" y1="520" x2="337" y2="520" stroke="#2b3854"/>
    <text x="28" y="550" class="small">Source : campagne optimisée / X-simplex</text>
  </g>

  <text x="50" y="792" class="small">S = Soldat · L = Lancier · A = Archer · C = Chevalier</text>
  <text x="1150" y="792" class="small" text-anchor="end">Résultats descriptifs · profil et règles épinglés au 26 septembre 2026</text>
</svg>
