<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">Rubans de combat du profil Nazz-Eq-20%-Rc2</title>
  <desc id="desc">Six confrontations monotypes aller-retour et quatre miroirs. Chaque ruban partage les victoires entre attaquant rouge, matchs nuls gris et défenseur bleu. Données X-simplex à 12 000 Or, 4 000 combats par orientation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#030611" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7ff}
      .subtitle{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa8c3}
      .card-title{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7ff}
      .label{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#dce4f5}
      .value{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#edf2ff}
      .small{font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8f9db8}
      .attack{fill:#f05252}.draw{fill:#8290aa}.defense{fill:#4f8cff}
      .track{fill:#202a41;stroke:#35415c;stroke-width:1}
      .tick{stroke:#f4f7ff;stroke-opacity:.55;stroke-width:1}
    </style>
  </defs>
