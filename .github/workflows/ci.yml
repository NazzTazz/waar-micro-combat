name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deployment-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Real Docker deployment and rollback on disposable runner
        run: sudo env ENGINE_TEST_DISPOSABLE_DOCKER=1 bash ops/demo/test-release-stack.sh
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build native cohort runtime required by workbench tests
        run: cargo build --locked --release --manifest-path engines/waar-cohort/rust/Cargo.toml
      - run: composer test
      - run: composer test:js
      - name: Exercise release transactions and failure recovery
        run: sudo bash ops/demo/test-release-scripts.sh
      - name: Generate short offline report
        run: php bin/run-wind-tunnel.php experiments/t24-astra-vector-corrections.json reports/ci-smoke
      - name: Verify report files
        run: test -s reports/ci-smoke/report.json && test -s reports/ci-smoke/report.html
