<VirtualHost *:8080>
    ServerName engine.waar-tools.fr
    DocumentRoot /app/public/workshop
    DirectoryIndex index.html
    Timeout 4800
    LimitRequestBody 2000000
    <Directory /app/public/workshop>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
    MaxConnectionsPerChild 100
</IfModule>
